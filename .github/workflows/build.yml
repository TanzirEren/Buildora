name: Build Buildora APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # lets the tag build attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          ls "$ANDROID_SDK_ROOT/platforms"
          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

      - name: Bundle the on-device toolchain (android.jar + aapt2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AAPT2_ARM64_URL: ${{ vars.AAPT2_ARM64_URL }}
          AAPT2_ARM_URL: ${{ vars.AAPT2_ARM_URL }}
          AAPT2_X86_64_URL: ${{ vars.AAPT2_X86_64_URL }}
          AAPT2_REPOS: ${{ vars.AAPT2_REPOS }}
        run: python3 scripts/fetch_toolchain.py

      - name: Show bundled tools
        run: ls -la app/src/main/assets/toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Check signing secrets
        id: sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/buildora-release.p12"
            test -s "$RUNNER_TEMP/buildora-release.p12"
            # fail early (before the long build) when the password or alias is wrong
            keytool -list -keystore "$RUNNER_TEMP/buildora-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "BUILDORA_KEYSTORE=$RUNNER_TEMP/buildora-release.p12" >> "$GITHUB_ENV"
            echo "Signing: release key found"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are missing. Building a debug-signed APK instead."
          fi

      - name: Build signed release APK
        if: steps.sign.outputs.enabled == 'true'
        env:
          BUILDORA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUILDORA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BUILDORA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Build debug APK (no signing secrets)
        if: steps.sign.outputs.enabled != 'true'
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify signature and rename APK
        run: |
          mkdir -p dist
          if [ "${{ steps.sign.outputs.enabled }}" = "true" ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            APKSIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
            "$APKSIGNER" verify --verbose --print-certs "$SRC"
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" dist/Buildora.apk
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buildora-APK
          path: dist/Buildora.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Buildora.apk
